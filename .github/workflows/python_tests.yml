name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      CONFIA_ENABLE_LLM_FORMAL_STEPS: "0"
      CONFIA_DYNAMIC_LLM_ENABLED: "0"
      CONFIA_SEMANTIC_LLM_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -c docs/audits/assets/dynamic-rc1/python-constraints.txt

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run JavaScript regressions
        run: node --test tests/js/*.cjs
